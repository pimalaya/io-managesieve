[package]
name = "io-managesieve"
description = "ManageSieve client library for Rust"
version = "0.5.0"
authors = ["Clément DOUIN (soywod) <pimalaya.org@posteo.net>"]
rust-version = "1.89"
edition = "2024"
license = "MIT OR Apache-2.0"
categories = ["email", "no-std"]
keywords = ["email", "sieve", "managesieve", "client", "io-free"]
homepage = "https://pimalaya.org"
documentation = "https://docs.rs/io-managesieve/latest/io_managesieve"
repository = "https://github.com/pimalaya/io-managesieve"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["client", "rustls-ring", "scram"]
client = ["dep:base64", "dep:io-sasl", "dep:log", "dep:secrecy", "io-sasl/client"]
std = ["client"]
scram = ["client", "io-sasl/scram", "io-sasl/scram-sha-1"]
cram-md5 = ["client", "io-sasl/cram-md5"]
url = ["dep:url"]
rustls-ring = ["std", "url", "pimalaya-stream/rustls-ring", "dep:anyhow", "dep:rand"]
rustls-aws = ["std", "url", "pimalaya-stream/rustls-aws", "dep:anyhow", "dep:rand"]
native-tls = ["std", "url", "pimalaya-stream/native-tls", "dep:anyhow", "dep:rand"]
vendored = ["pimalaya-stream?/vendored"]

[[example]]
name = "std_coroutine"
path = "examples/std_coroutine.rs"
required-features = ["client"]

[[example]]
name = "std_client_light"
path = "examples/std_client_light.rs"
required-features = ["std"]

[[example]]
name = "std_client_full"
path = "examples/std_client_full.rs"
required-features = ["rustls-ring"]

[[example]]
name = "tokio_session"
path = "examples/tokio_session.rs"
required-features = ["client", "url"]

[dev-dependencies]
env_logger = "0.11"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread"] }
url = "2"

[dependencies]
anyhow = { version = "1", optional = true }
base64 = { version = "0.23", default-features = false, features = ["alloc"], optional = true }
io-sasl = { version = "0.3", default-features = false, optional = true }
log = { version = "0.4", default-features = false, optional = true }
pimalaya-stream = { version = "0.4", default-features = false, optional = true }
rand = { version = "0.10", default-features = false, features = ["thread_rng"], optional = true }
secrecy = { version = "0.10", default-features = false, optional = true }
thiserror = { version = "2", default-features = false }
url = { version = "2.2", default-features = false, optional = true }
