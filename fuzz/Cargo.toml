[package]
name = "io-managesieve-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
io-managesieve = { path = "..", default-features = false }
io-sasl = { version = "0.2", default-features = false }
libfuzzer-sys = "0.4"

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "read"
path = "fuzz_targets/read.rs"
test = false
doc = false
bench = false

# Detach from the parent package so `cargo fuzz` builds this crate standalone.
[workspace]
